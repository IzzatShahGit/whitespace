[project]
name = "whitespace-pipeline"
version = "0.1.0"
description = "Whitespace data pipeline: download, clean, score and load trade data"
requires-python = ">=3.12,<3.13"
dependencies = [
    "whitespace-shared",
    "polars>=1.15",
    "duckdb>=1.1",
    "pyarrow>=18",
    "httpx>=0.28",
    "typer>=0.13",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2",
]

[project.scripts]
ws-pipeline = "whitespace_pipeline.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/whitespace_pipeline"]
