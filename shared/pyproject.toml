[project]
name = "whitespace-shared"
version = "0.1.0"
description = "Contracts shared by the pipeline and the API: gold-table schemas and reference data"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/whitespace_shared"]
